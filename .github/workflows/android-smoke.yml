name: Android playback runtime test
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: node scripts/restore-media.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/prepare-smoke.mjs
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p native-smoke connectedDebugAndroidTest --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-playback-test-results
          path: |
            native-smoke/app/build/reports/androidTests/
            native-smoke/app/build/outputs/androidTest-results/
