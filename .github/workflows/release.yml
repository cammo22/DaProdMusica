name: Release Windows and Android
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  runtime:
    uses: ./.github/workflows/android-smoke.yml
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: node scripts/check-shaders.mjs
      - run: node scripts/restore-media.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - id: version
        run: |
          node -e "const p=require('./package.json'), t=require('./src-tauri/tauri.conf.json');if(p.version!==t.version)process.exit(1);console.log('value='+p.version)" >> "$GITHUB_OUTPUT"
  android:
    needs: [verify,runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/restore-media.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run android:init -- --ci
      - run: node scripts/configure-android.mjs
      - run: npm run android:build -- --apk --target aarch64 --ci
        env:
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
      - name: Sign and verify release APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/daprod.p12"
          mkdir -p release-artifacts
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk')
          test "${#apks[@]}" -eq 1
          output="release-artifacts/DaProdMusica-${VERSION}-Android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -P 16 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/daprod.p12" --ks-type PKCS12 --ks-key-alias daprod --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out "$output" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$output" > release-artifacts/Android-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$output" > release-artifacts/Android-package.txt
          python3 scripts/check-apk.py "$output"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$output" AndroidManifest.xml > release-artifacts/Android-manifest.txt
          grep -q 'supportsPictureInPicture' release-artifacts/Android-manifest.txt
          grep -q 'io.github.cammo22.music.PlaybackService' release-artifacts/Android-manifest.txt
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' release-artifacts/Android-manifest.txt
          if grep -q application-debuggable release-artifacts/Android-package.txt; then exit 1; fi
          cd release-artifacts && sha256sum *.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/
          if-no-files-found: error
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/restore-media.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run desktop:build
      - shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $output = "release-artifacts/DaProdMusica-$env:VERSION-Windows-Setup.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" $output
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $output -Leaf)" | Set-Content release-artifacts/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/
          if-no-files-found: error
  draft:
    needs: [verify,android,windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$status" = true ]; then
            gh release edit "v$VERSION" --target "$GITHUB_SHA" --title "DaProd Musica $VERSION" --notes-file "releases/$VERSION.md"
            gh release upload "v$VERSION" release-artifacts/* --clobber
          elif [ -z "$status" ]; then
            gh release create "v$VERSION" release-artifacts/* --draft --target "$GITHUB_SHA" --title "DaProd Musica $VERSION" --notes-file "releases/$VERSION.md"
          else
            echo 'Refusing to overwrite a published release.' >&2
            exit 1
          fi
