name: Build native previews (no music bundled in CI)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm run desktop:build
      - if: runner.os == 'Linux'
        run: npm run tauri build -- --no-bundle
      - if: runner.os == 'Linux'
        working-directory: packaging/linux
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49
          flatpak-builder --user --repo=repo build flatpak.yml
          flatpak build-bundle repo DaProdMusica.flatpak io.github.cammo22.daprodmusica
      - uses: actions/upload-artifact@v4
        with:
          name: DaProdMusica-${{ runner.os }}-preview
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            packaging/linux/*.flatpak
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run android:init -- --ci
      - run: npm run android:build -- --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: DaProdMusica-Android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
