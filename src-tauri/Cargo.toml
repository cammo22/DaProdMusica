[package]
name = "daprod-musica"
version = "0.5.0"
description = "DaProd Musica — immersive album player"
authors = ["DaProd"]
edition = "2021"

[lib]
name = "daprod_musica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-music = { path = "plugins/music" }

